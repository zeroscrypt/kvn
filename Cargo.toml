[workspace]
resolver = "2"
members = ["crates/kvn-core", "crates/kvn-engine", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zeroscrypt/kvn"
authors = ["zeroscrypt"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util", "net"] }
base64 = "0.23"
percent-encoding = "2.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
