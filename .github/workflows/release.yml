name: Release

# Tag-driven releases: `git tag -s v0.1.0-rc.1 && git push origin v0.1.0-rc.1`.
# Every asset is built from the tagged commit, attested with GitHub build
# provenance, and attached to a *draft* release — publishing the draft is
# the promotion step, so the published bytes are exactly the reviewed ones.
# Draft releases (and their `vX.Y.Z` tags) are created by release-plz when a
# release PR is merged; because a `GITHUB_TOKEN` tag push does not trigger
# workflows, the release-plz workflow dispatches this one with `tag=<tag>`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build assets for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            args: --target aarch64-apple-darwin --bundles dmg
            artifacts: |
              target/**/release/bundle/dmg/*.dmg
          - platform: macos-x64
            os: macos-13
            args: --target x86_64-apple-darwin --bundles dmg
            artifacts: |
              target/**/release/bundle/dmg/*.dmg
          - platform: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            artifacts: |
              target/**/release/bundle/deb/*.deb
              target/**/release/bundle/appimage/*.AppImage
          - platform: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
            artifacts: |
              target/**/release/bundle/nsis/*.exe
              target/**/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux system dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Fetch pinned Xray sidecar
        shell: bash
        run: ./scripts/fetch-xray.sh --bundle

      - name: Build bundles
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.args }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifacts }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach assets to draft release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify the tag matches the workspace version
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as fh:
              print(tomllib.load(fh)["workspace"]["package"]["version"])
          PY
          )"
          base="${TAG#v}"
          base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag ${TAG} does not match workspace version ${version}"
            exit 1
          fi
          echo "tag ${TAG} matches ${version}"

      - name: Checksums and build info
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS ! -name build-info.json -print0 \
            | sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS
          python3 - "$TAG" "$(git rev-parse HEAD)" <<'PY'
          import datetime, json, sys
          tag, commit = sys.argv[1], sys.argv[2]
          info = {
              "tag": tag,
              "commit": commit,
              "version": tag.lstrip("v").split("-")[0],
              "created_utc": datetime.datetime.now(datetime.timezone.utc)
              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "engine_pin": "see core/xray.json",
              "signing": "unsigned build (no Apple Developer certificate); "
              "provenance attestation via actions/attest-build-provenance",
          }
          json.dump(info, open("build-info.json", "w"), indent=2)
          PY

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG}"
          files="$(find artifacts -type f | sort)"
          if gh release view "$tag" >/dev/null 2>&1; then
            # release-plz already created the (draft) release: attach.
            # shellcheck disable=SC2086
            gh release upload "$tag" $files --clobber
          else
            prerelease=""
            case "$tag" in *-rc*|*-alpha*|*-beta*) prerelease="--prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$tag" --draft --title "$tag" --generate-notes $prerelease $files
          fi
