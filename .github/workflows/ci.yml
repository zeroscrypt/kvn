name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  core:
    name: Core & engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Fetch pinned Xray (live integration tests)
        shell: bash
        run: ./scripts/fetch-xray.sh

      - name: Unit + integration tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              if [[ "$(uname -m)" == "arm64" ]]; then
                export XRAY_BIN="$PWD/.tools/xray-macos-arm64/xray"
              else
                export XRAY_BIN="$PWD/.tools/xray-macos-amd64/xray"
              fi
              ;;
            Linux) export XRAY_BIN="$PWD/.tools/xray-linux-amd64/xray" ;;
            Windows) export XRAY_BIN="$PWD/.tools/xray-windows-amd64/xray.exe" ;;
          esac
          cargo test -p kvn-core -p kvn-engine

  desktop:
    name: Desktop app build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux system dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Audit JS dependencies
        working-directory: apps/desktop
        run: pnpm audit --prod --audit-level high

      - name: Fetch pinned Xray sidecar (externalBin)
        shell: bash
        run: ./scripts/fetch-xray.sh --bundle

      - name: Check desktop crate
        run: cargo check -p kvn-desktop

      - name: Check release profile with embedded frontend
        run: cargo check --release -p kvn-desktop --features custom-protocol

      - name: Desktop unit tests
        run: cargo test -p kvn-desktop

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux system dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Fetch pinned Xray sidecar (externalBin)
        shell: bash
        run: ./scripts/fetch-xray.sh --bundle
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  commits:
    name: Commits (convention + DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Conventional Commit subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          subject="$PR_TITLE"
          if [ -z "$subject" ]; then
            subject="$(git log -1 --pretty=%s)"
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
            echo "::error::not a Conventional Commit subject: $subject"
            exit 1
          fi
          echo "subject ok: $subject"

      - name: DCO sign-off (PRs)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --pretty=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done < <(git rev-list "origin/${{ github.base_ref }}..HEAD")
          exit "$missing"

  ci-gate:
    name: ci-gate
    if: always()
    needs: [core, desktop, clippy, fmt, deny, commits]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs must pass
        run: |
          for result in \
            '${{ needs.core.result }}' \
            '${{ needs.desktop.result }}' \
            '${{ needs.clippy.result }}' \
            '${{ needs.fmt.result }}' \
            '${{ needs.deny.result }}' \
            '${{ needs.commits.result }}'; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
          echo "all required jobs passed"
