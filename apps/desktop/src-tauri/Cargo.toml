[package]
name = "kvn-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "KVN — desktop console client for 3x-ui / Xray-core servers"
publish = false

[lib]
name = "kvn_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Production builds must enable this (the Tauri CLI does it automatically):
# without it `tauri::generate_context!` points at `build.devUrl` instead of
# the embedded frontend, and a binary started without a dev server shows a
# blank window. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
kvn-core = { path = "../../../crates/kvn-core" }
kvn-engine = { path = "../../../crates/kvn-engine" }
uuid = { workspace = true }
ureq = "3"
